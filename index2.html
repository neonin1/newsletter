<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SKI&Sun - Aktualności</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1220;
            color: #e5e7eb;
            margin: 0;
            padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(24px, env(safe-area-inset-left));
            padding-right: max(24px, env(safe-area-inset-right));
        }
        .card {
            max-width: 900px;
            margin: 0 auto;
            background: #0f1b33;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px 18px 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.35rem;
            line-height: 1.25;
            flex: 1;
            min-width: 0;
        }
        .gearBtn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #93c5fd;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0;
        }
        .gearBtn:active {
            background: rgba(255, 255, 255, 0.12);
        }
        .gearBtn svg {
            width: 22px;
            height: 22px;
            display: block;
        }
        .gearBtn[aria-expanded="true"] {
            background: rgba(147, 197, 253, 0.18);
            border-color: rgba(147, 197, 253, 0.45);
        }
        .line {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            margin: 10px 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .msg {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.15);
            margin: 10px 0;
        }
        #admin-panel {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #1c2a48;
            border-radius: 12px;
        }
        #admin-panel input, #admin-panel textarea, #admin-panel select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #333;
            color: #e5e7eb;
            border: 1px solid #555;
            font-size: 16px; /* zapobiega zoomowi iOS przy focusie */
        }
        #admin-panel button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        #admin-panel button:hover {
            background-color: #45a049;
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
            .card {
                padding: 14px 12px 8px;
            }
            .header h1 {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>SKI&Sun - Aktualne informacje:</h1>
            <button type="button" class="gearBtn" id="gear-btn" onclick="toggleAdminPanel()" aria-label="Ustawienia / Panel administratora" aria-controls="admin-panel" aria-expanded="false" title="Ustawienia">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M19.4 13.5a7.8 7.8 0 0 0 .05-1.1c0-.37-.02-.74-.05-1.1l2.05-1.6a.5.5 0 0 0 .12-.64l-1.94-3.36a.5.5 0 0 0-.6-.22l-2.42.97a8.3 8.3 0 0 0-1.9-1.1L14.4 2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.37 2.55c-.67.27-1.3.64-1.9 1.1l-2.42-.97a.5.5 0 0 0-.6.22L2.37 9.06a.5.5 0 0 0 .12.64l2.05 1.6c-.03.36-.05.73-.05 1.1 0 .37.02.74.05 1.1l-2.05 1.6a.5.5 0 0 0-.12.64l1.94 3.36c.13.23.4.32.63.22l2.42-.97c.58.45 1.22.82 1.9 1.1l.37 2.55c.04.23.25.4.5.4h3.8c.25 0 .46-.17.5-.4l.37-2.55c.67-.27 1.32-.64 1.9-1.1l2.42.97c.23.1.5 0 .63-.22l1.94-3.36a.5.5 0 0 0-.12-.64l-2.05-1.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div id="objects-container"></div>

        <div class="sep"></div>
        <h2>Aktualne komunikaty:</h2>
        <div id="messages-container"></div>

        <div id="admin-panel">
            <h3>Dodaj obiekt:</h3>
            <form id="add-object-form">
                <input type="text" id="object-name" placeholder="Nazwa obiektu" required>
                <input type="text" id="object-hours" placeholder="Godziny otwarcia" required>
                <textarea id="object-info" placeholder="Informacje dodatkowe"></textarea>
                <label>Status: </label>
                <select id="object-status">
                    <option value="true">OTWARTE</option>
                    <option value="false">ZAMKNIĘTE</option>
                </select>
                <button type="submit">Dodaj Obiekt</button>
            </form>

            <h3>Dodaj komunikat:</h3>
            <form id="add-message-form">
                <textarea id="message-text" placeholder="Treść komunikatu" required></textarea>
                <button type="submit">Dodaj Komunikat</button>
            </form>
        </div>
    </div>

    <script>
        const objects = [
            { name: "Kolej gondolowa", open: true, hours: "09:00-16:00 oraz nocne 18:00-21:00", info: "" },
            { name: "Nartostrada", open: true, hours: "09:00-16:00 oraz nocne 18:00-21:00", info: "" },
            { name: "Orczyk", open: true, hours: "09:00-16:00 oraz 18:00-21:00", info: "" }
        ];

        const messages = [
            { ts: "16.01.2026 12:00", text: "Pogoda sprzyja! Zapraszamy na stoki.", isNew: true },
            { ts: "15.01.2026 09:00", text: "Zmienione godziny otwarcia stoku. Sprawdź przed wyjazdem.", isNew: false }
        ];

        function displayObjects() {
            const container = document.getElementById("objects-container");
            container.innerHTML = '';

            objects.forEach(obj => {
                const div = document.createElement("div");
                div.classList.add("line");
                const status = obj.open ? "czynna" : "zamknięta";
                div.innerHTML = `
                    <div class="dot" style="background:${obj.open ? '#16a34a' : '#dc2626'};"></div>
                    <div class="txt">
                        <div class="name">${obj.name} <span class="st">(${status})</span></div>
                        <div class="hours">${obj.hours}</div>
                        <div class="info">${obj.info}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function displayMessages() {
            const container = document.getElementById("messages-container");
            container.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement("div");
                div.classList.add("msg");
                div.classList.add(msg.isNew ? "new" : "old");
                div.innerHTML = `
                    <div class="ts">${msg.ts}</div>
                    <div class="txt">${msg.text}</div>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById("add-object-form").addEventListener("submit", function(event) {
            event.preventDefault();
            const name = document.getElementById("object-name").value;
            const hours = document.getElementById("object-hours").value;
            const info = document.getElementById("object-info").value;
            const open = document.getElementById("object-status").value === "true";

            objects.push({ name, hours, info, open });
            displayObjects();
            document.getElementById("add-object-form").reset();
        });

        document.getElementById("add-message-form").addEventListener("submit", function(event) {
            event.preventDefault();
            const text = document.getElementById("message-text").value;
            const ts = new Date().toLocaleString();
            messages.unshift({ ts, text, isNew: true });
            displayMessages();
            document.getElementById("add-message-form").reset();
        });

        function toggleAdminPanel() {
            const panel = document.getElementById("admin-panel");
            const gear = document.getElementById("gear-btn");
            const open = panel.style.display === "none" || panel.style.display === "";
            panel.style.display = open ? "block" : "none";
            gear.setAttribute("aria-expanded", open ? "true" : "false");
            if (open) {
                panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        displayObjects();
        displayMessages();
    </script>

</body>
</html>
